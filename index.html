<style>
  /* Between parties: the cottage from the app's login screen, and a countdown.
     The painting's own green continues past its edges on wide screens. */
  :root { --moss: #224626; --cream: #f1ead7; --soft: #cfd8c4; --ember: #e2a676;
          --serif: "Cormorant Garamond", Georgia, serif; --body: "EB Garamond", Georgia, serif; }
  * { box-sizing: border-box; }
  /* Nothing is pinned (no position: fixed): iPhone Safari (iOS 26) paints a solid band over
     anything pinned to the top or bottom of the screen. The window never scrolls; main does,
     over a still painting. On phones both reach a little below the "large" screen height,
     where Safari's bottom bar sits. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  :root { --below: 0px; --above: 160px; }
  @media (pointer: coarse) { :root { --below: 120px; } }
  /* All lowercase, like the lodge app itself (its golden rule) */
  body { background: var(--moss); color: var(--cream); font-family: var(--body); overflow-x: hidden; text-transform: lowercase; }
  /* The painting fills the screen; above it, a strip (--above) holds its top edge mirrored.
     The window is held scrolled down by that strip, so iPhone Safari shows sky behind the clock. */
  .scene { position: absolute; top: 0; left: 0; right: 0; height: calc(100vh + var(--above) + var(--below)); height: calc(100lvh + var(--above) + var(--below)); overflow: hidden; }
  .scene::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: var(--above); transform: scaleY(-1);
    background: linear-gradient(rgba(14, 32, 17, .55), rgba(14, 32, 17, .55)), url(img/cottage.webp) center top / auto calc(100vh + var(--below)) no-repeat;
    background-size: auto, auto calc(100lvh + var(--below)); }
  .scene img {
    position: absolute; top: var(--above); left: 50%; translate: -50% 0; height: calc(100% - var(--above)); width: auto; max-width: none;
    -webkit-touch-callout: none; -webkit-user-drag: none; user-select: none; pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
  }
  /* Narrower than the painting (phones): no fade needed, the sides are cropped */
  @media (max-aspect-ratio: 804/1538) { .scene img { -webkit-mask-image: none; mask-image: none; } }
  /* Wider screens: the app's own wide painting (the one on its login), edge to edge,
     the same as the live app; no faded sides. The mirrored strip above uses it too. */
  @media (min-aspect-ratio: 804/1538) {
    .bottom { margin-bottom: 2svh; gap: 12px; }
    .count b { font-size: clamp(30px, 4.2vw, 46px); }
    .when { margin-top: 10px; font-size: 17px; }
    /* the house sits a little higher than the painting's middle, so the countdown and the button
       stand on the grass below it, never in front of it */
    .scene { background: var(--moss) url(img/cottage-wide.jpg) no-repeat; background-position: center calc(var(--above) - 4lvh); background-size: max(100vw, calc((100lvh + var(--below)) * 2307 / 1538)) auto; }
    @media (min-aspect-ratio: 2/1) { .scene { background-position: center calc(var(--above) - (100vw * 1538 / 2307 - 100lvh) * .4); } }
    .scene img { display: none; }
    .scene::before { background: linear-gradient(rgba(14, 32, 17, .55), rgba(14, 32, 17, .55)), url(img/cottage-wide.jpg) center top / max(100vw, calc((100lvh + var(--below)) * 2307 / 1538)) auto no-repeat; }
  }
  /* Darken the top and bottom a little, so the words read over the paint */
  .scene::after { content: ""; position: absolute; inset: var(--above) 0 0;
    background: linear-gradient(rgba(14, 32, 17, .55), transparent 28%, transparent 62%, rgba(14, 32, 17, .7)); }

  main {
    position: absolute; top: 0; left: 0; right: 0; height: calc(100vh + var(--above) + var(--below)); height: calc(100lvh + var(--above) + var(--below));
    overflow-x: hidden; overflow-y: auto; overscroll-behavior: none; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center;
    padding: calc(var(--above) + max(20px, env(safe-area-inset-top))) max(16px, env(safe-area-inset-right)) calc(max(20px, env(safe-area-inset-bottom)) + var(--below)) max(16px, env(safe-area-inset-left));
  }
  .lang {
    justify-self: end; min-width: 52px; min-height: 44px; padding: 0 14px; border-radius: 22px; cursor: pointer;
    font: 600 16px var(--body); letter-spacing: .08em; color: var(--cream); background: transparent; border: 0; text-shadow: 0 1px 8px rgba(0, 0, 0, .5);
  }
  .lang:hover { background: var(--cream); color: var(--moss); }
  :focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
  header { margin-top: 2svh; }
  /* the app's own cursive logo (Italianno), as on lodgedoivo's top bar */
  h1 { font: 400 clamp(64px, 15vw, 120px)/.9 'Italianno', cursive; margin: 0; letter-spacing: 0; text-transform: none; text-shadow: 0 2px 18px rgba(0, 0, 0, .35); }
  .see { font: italic 500 clamp(22px, 3.6vw, 30px)/1.25 var(--serif); margin: 10px 0 0; color: var(--soft); text-wrap: balance; }

  .bottom { display: grid; gap: 18px; justify-items: center; align-self: end; margin-bottom: 9svh; }
  .count { display: flex; gap: clamp(12px, 3vw, 28px); margin: 0; padding: 0; list-style: none; }
  .count li { display: grid; min-width: 64px; }
  /* the same type as inside the app: EB Garamond, small spaced labels */
  .count b { font: 500 clamp(34px, 7vw, 52px)/1 var(--body); font-variant-numeric: lining-nums tabular-nums; }
  .count span { font-size: 12.5px; font-weight: 600; letter-spacing: .16em; color: var(--soft); margin-top: 8px; }
  .when { font-size: 19px; margin: 26px 0 0; }
  .tba { font: italic 500 26px var(--serif); margin: 0; }
  .demo {
    /* the app's own button (like "entrar" on its login): cream block, small spaced lowercase letters */
    display: inline-flex; align-items: center; justify-content: center; min-height: 46px; min-width: 220px; padding: 0 26px; border-radius: 6px; text-decoration: none;
    color: #1c1612; background: var(--cream); font: 600 13px var(--body); letter-spacing: .16em;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none;
  }
  .demo:hover { background: #fff; }
  /* Phones: the painting fills the height from the top, so the roof is at a
     fixed share of it. The line sits just above the roof, under the smoke. */
  @media (max-width: 600px) and (orientation: portrait) {
    /* Placed as shares of the painting's height (the painting is as tall as .scene):
       the line just above the roof, the countdown just below the house. */
    .see { position: absolute; left: 0; right: 0; top: calc(var(--above) + (100lvh + var(--below)) * .225); margin: 0; padding: 0 16px;
           text-shadow: 0 1px 2px rgba(14, 32, 17, .9), 0 2px 14px rgba(14, 32, 17, .7); }
    .bottom { position: absolute; left: 0; right: 0; top: calc(var(--above) + (100lvh + var(--below)) * .635); margin: 0; gap: 12px;
              padding: 0 16px calc(24px + var(--below)); }
    .when { margin-top: 14px; }
  }
</style>

<body>
<div class="scene" aria-hidden="true"><img src="img/cottage.webp" alt="" width="804" height="1538"></div>
<main>
  <button class="lang" id="lang" type="button">pt</button>
  <header>
    <h1>lodgedoivo</h1>
    <p class="see" data-t="see"></p>
  </header>
  <div class="bottom">
    <div id="clock" aria-live="off"></div>
    <a draggable="false" class="demo" href="https://lodge-demo.appdoivo.com" data-t="demo"></a>
  </div>
</main>
<script>
  // The next party: Ivo's birthday is 15 September; the party is that weekend
  // (from the Friday) when the 15th falls on a weekend, else the next weekend.
  // Worked out every year, so the page never needs touching. To pin a date
  // instead, set OVERRIDE, e.g. "2027-09-17T21:00:00+01:00".
  const OVERRIDE = null;
  function partyDay(year) {
    const bday = new Date(year, 8, 15);                    // 15 September
    const dow = bday.getDay();                             // 0 Sun … 6 Sat
    if (dow === 6) return new Date(year, 8, 14);           // Saturday: that weekend's Friday
    if (dow === 0) return new Date(year, 8, 13);           // Sunday: that weekend's Friday
    return new Date(year, 8, 15 + ((5 - dow + 7) % 7));    // the next Friday (or the 15th itself)
  }
  function nextParty() {
    if (OVERRIDE) return new Date(OVERRIDE).getTime();
    const y = new Date().getFullYear();
    // Counts to the Friday; the page stays on "party time" until the Monday
    for (const year of [y, y + 1]) { const d = partyDay(year); if (Date.now() < d.getTime() + 3 * 864e5) return d.getTime(); }
  }
  const NEXT = nextParty();

  const T = {
    en: { see: "see you next year", tba: "date to be announced", now: "it's party time", demo: "try the demo", units: ["days", "hours", "minutes", "seconds"], other: "pt", otherLabel: "ver em português", title: "lodgedoivo · see you next year" },
    pt: { see: "até para o ano", tba: "data a anunciar", now: "é hora da festa", demo: "experimentar a demo", units: ["dias", "horas", "minutos", "segundos"], other: "en", otherLabel: "view in English", title: "lodgedoivo · até para o ano" },
  };
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (_) {}
  let lang = new URLSearchParams(location.search).get("lang") || saved || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");
  if (!T[lang]) lang = "en";
  const clock = document.getElementById("clock");
  const target = NEXT || null;

  function tick() {
    const t = T[lang];
    if (!target) { clock.innerHTML = `<p class="tba">${t.tba}</p>`; return; }
    const left = target - Date.now();
    if (left <= 0) { clock.innerHTML = `<p class="tba">${t.now}</p>`; return; }
    const parts = [Math.floor(left / 864e5), Math.floor(left / 36e5) % 24, Math.floor(left / 6e4) % 60, Math.floor(left / 1e3) % 60];
    const day = new Date(target).toLocaleDateString(lang === "pt" ? "pt-PT" : "en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    clock.innerHTML = `<ul class="count">${parts.map((n, i) => `<li><b>${String(n).padStart(i ? 2 : 1, "0")}</b><span>${t.units[i]}</span></li>`).join("")}</ul><p class="when">${day}</p>`;
  }
  function fill() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t[el.dataset.t]));
    const b = document.getElementById("lang"); b.textContent = t.other; b.setAttribute("aria-label", `${t.other}: ${t.otherLabel}`);
    tick();
  }
  fill();
  if (target) setInterval(tick, 1000);
  document.getElementById("lang").addEventListener("click", () => {
    lang = lang === "pt" ? "en" : "pt";
    try { localStorage.setItem("lang", lang); } catch (_) {}
    fill();
  });
</script>
<!-- iPhone Safari fills the area behind the clock with whatever lies just above the
     top of the screen: the window is held scrolled down by the painted strip above. -->
<script>
(function () {
  var y = 160;
  function keep() { if (Math.abs(window.scrollY - y) > 0.5) window.scrollTo(0, y); }
  keep();
  document.addEventListener("DOMContentLoaded", keep);
  window.addEventListener("load", keep);
  window.addEventListener("resize", keep);
  window.addEventListener("pageshow", keep);
  window.addEventListener("scroll", keep, { passive: true });
})();
</script>
